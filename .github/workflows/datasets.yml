name: Datasets

on:
  push:
    paths:
      - 'use-cases/**'
      - '.github/workflows/datasets.yml'
  pull_request:
    paths:
      - 'use-cases/**'
      - '.github/workflows/datasets.yml'

jobs:
  load:
    name: Load dataset
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dataset:
          - bookstore
          - cyber-threat-intelligence
          - drug-discovery
          - fraud-detection
          - identity-and-access-management
          - social-network
          - supply-chain

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup TypeDB
      uses: typedb/setup-typedb@1.0.0
      with:
        typedb_version: 3.14.1
        typedb_args: "--development-mode.enabled=true"

    - name: Load dataset
      run: |
        typedb console --address=localhost:1729 --tls-disabled \
          --username=admin --password=password \
          --command="database create-init ${{ matrix.dataset}} \
          use-cases/${{matrix.dataset}}/schema.tql \
          use-cases/${{matrix.dataset}}/data.tql"

  load-social-network-generated:
    name: Load social network with generated data
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: use-cases/social-network/data_generation

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup TypeDB
      uses: typedb/setup-typedb@1.0.0
      with:
        typedb_version: 3.14.1
        typedb_args: "--development-mode.enabled=true"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Generate queries
      run: python query_generator.py

    - name: Load generated dataset
      run: python query_runner.py
